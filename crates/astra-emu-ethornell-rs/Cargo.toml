[package]
name = "astra-emu-ethornell-rs"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "astra_emu_ethornell_rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
diagnostic-bridge = ["astra-emu-abi/diagnostic-bridge"]

[dependencies]
astra-emu-abi = { git = "https://github.com/2018wzh/AstraEngine.git", rev = "6d9d691dcc8f3d768e40b5be1d6f37366cca62d8" }
ethornell-app = { path = "../ethornell-app" }
ethornell-archive = { path = "../ethornell-archive" }
tracing.workspace = true
