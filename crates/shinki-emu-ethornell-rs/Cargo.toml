[package]
name = "shinki-emu-ethornell-rs"
version = "0.1.0"
edition.workspace = true
rust-version = "1.92"
publish = false
build = "build.rs"

[lib]
name = "shinki_emu_ethornell_rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
diagnostic-bridge = ["shinki-emu-abi/diagnostic-bridge"]

[dependencies]
shinki-emu-abi = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "9cd899babbb54cbc84c3e9fbddfe192c2f9200c8" }
ethornell-app = { path = "../ethornell-app" }
ethornell-archive = { path = "../ethornell-archive" }
tracing.workspace = true

[build-dependencies]
shinki-emu-build = { git = "https://github.com/Project-Shinkirou/ShinkiEMU", rev = "9cd899babbb54cbc84c3e9fbddfe192c2f9200c8" }
