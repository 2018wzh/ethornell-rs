[workspace]
members = [
  "crates/ethornell-core",
  "crates/ethornell-archive",
  "crates/ethornell-image",
  "crates/ethornell-script",
  "crates/ethornell-vm",
  "crates/ethornell-render",
  "crates/ethornell-audio",
  "crates/ethornell-app",
  "crates/astra-emu-ethornell",
  "crates/ethornell-cli",
  "crates/na_mpeg2_decoder",
  "crates/na_wmv_player",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = ""

[workspace.lints.clippy]
# Preserve explicit offsets and row/column formulas in indexed data layouts.
identity_op = "allow"
erasing_op = "allow"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
encoding_rs = "0.8"
wgpu = "0.19"
winit = "0.31.0-beta.3"
kira = { git = "https://github.com/2018wzh/kira.git", rev = "da8668fcd5e543eec2e9ea9871b310276e09fdc5" }
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"

[patch.crates-io]
cpal = { git = "https://github.com/2018wzh/cpal.git", rev = "65ac8a6ac1a635cc26bfc5af331295b052044908" }
